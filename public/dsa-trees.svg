<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="starGlow">
      <stop offset="0%" style="stop-color:#FFFF00;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#treeGradient)"/>

  <!-- Root node -->
  <circle cx="200" cy="80" r="28" fill="url(#starGlow)"/>
  <circle cx="200" cy="80" r="28" fill="none" stroke="#FFFF00" stroke-width="2"/>
  <text x="200" y="90" font-size="20" font-weight="bold" fill="#FF6347" text-anchor="middle">ROOT</text>

  <!-- Branch lines -->
  <line x1="180" y1="105" x2="120" y2="160" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
  <line x1="220" y1="105" x2="280" y2="160" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>

  <!-- Level 2 nodes -->
  <circle cx="120" cy="180" r="24" fill="#00D4FF" opacity="0.85"/>
  <circle cx="120" cy="180" r="24" fill="none" stroke="#00FF88" stroke-width="2"/>
  <text x="120" y="188" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L</text>

  <circle cx="280" cy="180" r="24" fill="#00FF88" opacity="0.85"/>
  <circle cx="280" cy="180" r="24" fill="none" stroke="#00D4FF" stroke-width="2"/>
  <text x="280" y="188" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">R</text>

  <!-- Level 3 branches -->
  <line x1="105" y1="204" x2="70" y2="250" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <line x1="135" y1="204" x2="170" y2="250" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

  <line x1="265" y1="204" x2="230" y2="250" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <line x1="295" y1="204" x2="330" y2="250" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

  <!-- Level 3 nodes -->
  <circle cx="70" cy="265" r="18" fill="#FF00FF" opacity="0.8"/>
  <circle cx="70" cy="265" r="18" fill="none" stroke="#FFFF00" stroke-width="1.5"/>

  <circle cx="170" cy="265" r="18" fill="#00D4FF" opacity="0.8"/>
  <circle cx="170" cy="265" r="18" fill="none" stroke="#FFFF00" stroke-width="1.5"/>

  <circle cx="230" cy="265" r="18" fill="#00FF88" opacity="0.8"/>
  <circle cx="230" cy="265" r="18" fill="none" stroke="#FFFF00" stroke-width="1.5"/>

  <circle cx="330" cy="265" r="18" fill="#FF00FF" opacity="0.8"/>
  <circle cx="330" cy="265" r="18" fill="none" stroke="#FFFF00" stroke-width="1.5"/>

  <!-- Glow particles around tree -->
  <circle cx="90" cy="120" r="8" fill="#FFFF00" opacity="0.6"/>
  <circle cx="310" cy="150" r="6" fill="#00FF88" opacity="0.5"/>
  <circle cx="150" cy="220" r="7" fill="#FF00FF" opacity="0.5"/>
  <circle cx="260" cy="200" r="5" fill="#00D4FF" opacity="0.6"/>

  <!-- Mystical figure -->
  <g id="treeMagician">
    <!-- Body glow -->
    <circle cx="200" cy="350" r="45" fill="none" stroke="#FFFF00" stroke-width="2" opacity="0.4"/>

    <!-- Head -->
    <circle cx="200" cy="310" r="20" fill="#FFD700"/>
    <circle cx="200" cy="310" r="20" fill="none" stroke="#FF6347" stroke-width="2"/>

    <!-- Crown -->
    <polygon points="175,295 185,280 200,275 215,280 225,295" fill="#FFD700"/>
    <circle cx="185" cy="285" r="4" fill="#FF00FF"/>
    <circle cx="200" cy="280" r="4" fill="#00D4FF"/>
    <circle cx="215" cy="285" r="4" fill="#00FF88"/>

    <!-- Body -->
    <rect x="185" y="330" width="30" height="35" fill="#00D4FF" opacity="0.7" rx="5"/>

    <!-- Arms with magic aura -->
    <line x1="185" y1="340" x2="140" y2="350" stroke="#00FF88" stroke-width="5" stroke-linecap="round"/>
    <line x1="215" y1="340" x2="260" y2="350" stroke="#00FF88" stroke-width="5" stroke-linecap="round"/>

    <!-- Legs -->
    <line x1="192" y1="365" x2="185" y2="395" stroke="#FF6347" stroke-width="4" stroke-linecap="round"/>
    <line x1="208" y1="365" x2="215" y2="395" stroke="#FF6347" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Title background -->
  <rect x="0" y="420" width="400" height="80" fill="#000000" opacity="0.7"/>

  <!-- Title -->
  <text x="200" y="465" font-size="48" font-weight="bold" fill="#FFFF00" text-anchor="middle" font-family="Arial">TREES</text>
</svg>
