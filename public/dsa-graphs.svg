<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="graphGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C853;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="nodeRadial">
      <stop offset="0%" style="stop-color:#FFFF00;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#00FF88;stop-opacity:0.2" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#graphGradient)"/>

  <!-- Grid pattern (maze) -->
  <g id="maze" opacity="0.2">
    <line x1="60" y1="80" x2="340" y2="80" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="60" y1="120" x2="340" y2="120" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="60" y1="160" x2="340" y2="160" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="60" y1="200" x2="340" y2="200" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="60" y1="240" x2="340" y2="240" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="60" y1="80" x2="60" y2="240" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="120" y1="80" x2="120" y2="240" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="180" y1="80" x2="180" y2="240" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="240" y1="80" x2="240" y2="240" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="300" y1="80" x2="300" y2="240" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="340" y1="80" x2="340" y2="240" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Explored path (BFS/DFS trail) -->
  <path d="M 80,100 L 140,100 L 140,160 L 200,160 L 200,220 L 260,220 L 260,160 L 320,160"
        fill="none" stroke="#00FF88" stroke-width="4" opacity="0.8" stroke-linecap="round"/>

  <!-- Vertices/Nodes -->
  <g id="nodes">
    <!-- Start node -->
    <circle cx="80" cy="100" r="18" fill="url(#nodeRadial)"/>
    <circle cx="80" cy="100" r="18" fill="none" stroke="#FFFF00" stroke-width="3"/>
    <text x="80" y="108" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">S</text>

    <!-- Intermediate nodes -->
    <circle cx="140" cy="100" r="16" fill="#00FF88" opacity="0.8"/>
    <circle cx="140" cy="100" r="16" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="140" cy="160" r="16" fill="#00FF88" opacity="0.8"/>
    <circle cx="140" cy="160" r="16" fill="none" stroke="#FFFFFF" stroke-width="2"/>

    <circle cx="200" cy="160" r="16" fill="#00D4FF" opacity="0.8"/>
    <circle cx="200" cy="160" r="16" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="200" cy="220" r="16" fill="#00D4FF" opacity="0.8"/>
    <circle cx="200" cy="220" r="16" fill="none" stroke="#FFFFFF" stroke-width="2"/>

    <circle cx="260" cy="220" r="16" fill="#00FF88" opacity="0.8"/>
    <circle cx="260" cy="220" r="16" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="260" cy="160" r="16" fill="#00FF88" opacity="0.8"/>
    <circle cx="260" cy="160" r="16" fill="none" stroke="#FFFFFF" stroke-width="2"/>

    <!-- End node -->
    <circle cx="320" cy="160" r="18" fill="url(#nodeRadial)"/>
    <circle cx="320" cy="160" r="18" fill="none" stroke="#FF00FF" stroke-width="3"/>
    <text x="320" y="168" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">E</text>
  </g>

  <!-- Explorer/Adventurer figure -->
  <g id="explorer">
    <!-- Head -->
    <circle cx="200" cy="310" r="22" fill="#FFD700"/>
    <circle cx="200" cy="310" r="22" fill="none" stroke="#00C853" stroke-width="2"/>

    <!-- Explorer hat -->
    <path d="M 180,295 L 175,280 L 200,275 L 225,280 L 220,295" fill="#FF6347"/>

    <!-- Goggles -->
    <circle cx="190" cy="308" r="5" fill="none" stroke="#000000" stroke-width="1.5"/>
    <circle cx="210" cy="308" r="5" fill="none" stroke="#000000" stroke-width="1.5"/>
    <line x1="195" y1="308" x2="205" y2="308" stroke="#000000" stroke-width="1"/>

    <!-- Body/Vest -->
    <rect x="185" y="335" width="30" height="30" fill="#00C853" opacity="0.9" rx="3"/>

    <!-- Arms with torches -->
    <line x1="185" y1="345" x2="130" y2="330" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
    <line x1="215" y1="345" x2="270" y2="330" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>

    <!-- Torch flames -->
    <polygon points="130,320 125,310 135,310" fill="#FF4500"/>
    <polygon points="270,320 265,310 275,310" fill="#FF4500"/>
    <circle cx="130" cy="318" r="4" fill="#FFFF00" opacity="0.8"/>
    <circle cx="270" cy="318" r="4" fill="#FFFF00" opacity="0.8"/>

    <!-- Legs -->
    <line x1="192" y1="365" x2="185" y2="395" stroke="#00C853" stroke-width="4" stroke-linecap="round"/>
    <line x1="208" y1="365" x2="215" y2="395" stroke="#00C853" stroke-width="4" stroke-linecap="round"/>

    <!-- Backpack -->
    <rect x="195" y="328" width="18" height="25" fill="#FF6347" opacity="0.8"/>
  </g>

  <!-- Glowing markers -->
  <circle cx="100" cy="140" r="5" fill="#00FF88" opacity="0.7"/>
  <circle cx="280" cy="200" r="5" fill="#00FF88" opacity="0.7"/>
  <circle cx="180" cy="280" r="4" fill="#00D4FF" opacity="0.6"/>

  <!-- Title background -->
  <rect x="0" y="420" width="400" height="80" fill="#000000" opacity="0.75"/>

  <!-- Title -->
  <text x="200" y="455" font-size="44" font-weight="bold" fill="#00FF88" text-anchor="middle" font-family="Arial">GRAPHS</text>
  <text x="200" y="485" font-size="16" fill="#00D4FF" text-anchor="middle" font-family="Arial">BFS &amp; DFS</text>
</svg>
