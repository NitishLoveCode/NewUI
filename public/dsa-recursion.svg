<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="recursionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9D4EDD;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5A189A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A0CA3;stop-opacity:1" />
    </linearGradient>
    <filter id="recursionGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#recursionGradient)"/>

  <!-- Nested/Recursive frames -->
  <g id="recursiveLayers">
    <!-- Outer frame 1 -->
    <rect x="30" y="80" width="340" height="240" fill="none" stroke="#00D4FF" stroke-width="3" rx="8" opacity="0.8" filter="url(#recursionGlow)"/>

    <!-- Middle frame 2 -->
    <rect x="70" y="110" width="260" height="180" fill="none" stroke="#00FF88" stroke-width="2.5" rx="6" opacity="0.9" filter="url(#recursionGlow)"/>

    <!-- Inner frame 3 -->
    <rect x="110" y="140" width="180" height="120" fill="none" stroke="#FF00FF" stroke-width="2" rx="4" opacity="1" filter="url(#recursionGlow)"/>

    <!-- Innermost frame -->
    <rect x="150" y="170" width="100" height="60" fill="#FFFF00" stroke="#FFFF00" stroke-width="2" rx="3" opacity="0.7" filter="url(#recursionGlow)"/>
    <text x="200" y="210" font-size="24" font-weight="bold" fill="#000000" text-anchor="middle">BASE</text>
  </g>

  <!-- Coder/Programmer figure replicated -->
  <g id="programmer1" opacity="0.9">
    <!-- Head -->
    <circle cx="80" cy="130" r="14" fill="#FFD700"/>
    <circle cx="80" cy="130" r="14" fill="none" stroke="#FF1744" stroke-width="1.5"/>
    <!-- Body -->
    <rect x="72" y="148" width="16" height="20" fill="#00D4FF" opacity="0.8" rx="2"/>
    <!-- Code brackets -->
    <text x="75" y="185" font-size="14" font-weight="bold" fill="#00FF88">&lt;</text>
    <text x="85" y="185" font-size="14" font-weight="bold" fill="#00FF88">&gt;</text>
  </g>

  <!-- Coder figure 2 (smaller, nested) -->
  <g id="programmer2" opacity="1">
    <!-- Head -->
    <circle cx="200" cy="155" r="12" fill="#FFD700"/>
    <circle cx="200" cy="155" r="12" fill="none" stroke="#00FF88" stroke-width="1.5"/>
    <!-- Body -->
    <rect x="194" y="170" width="12" height="18" fill="#00FF88" opacity="0.9" rx="2"/>
    <!-- Code symbols -->
    <text x="197" y="200" font-size="12" font-weight="bold" fill="#FF00FF">f()</text>
  </g>

  <!-- Coder figure 3 (even smaller) -->
  <g id="programmer3" opacity="1">
    <!-- Head -->
    <circle cx="200" cy="195" r="8" fill="#FFD700" opacity="0.9"/>
    <circle cx="200" cy="195" r="8" fill="none" stroke="#FF00FF" stroke-width="1"/>
    <!-- Mini code -->
    <text x="195" y="215" font-size="9" font-weight="bold" fill="#FFFF00">{ }</text>
  </g>

  <!-- Mirror lines showing reflection/recursion -->
  <line x1="40" y1="200" x2="90" y2="200" stroke="#00FF88" stroke-width="1" opacity="0.5" stroke-dasharray="3,3"/>
  <line x1="110" y1="200" x2="160" y2="200" stroke="#00D4FF" stroke-width="1" opacity="0.6" stroke-dasharray="3,3"/>
  <line x1="180" y1="200" x2="230" y2="200" stroke="#FF00FF" stroke-width="1" opacity="0.7" stroke-dasharray="3,3"/>

  <!-- Call stack visualization on side -->
  <g id="callStack">
    <!-- Stack representation -->
    <rect x="310" y="120" width="70" height="60" fill="none" stroke="#00FF88" stroke-width="1.5" opacity="0.6"/>
    <line x1="310" y1="140" x2="380" y2="140" stroke="#00FF88" stroke-width="1" opacity="0.5"/>
    <line x1="310" y1="160" x2="380" y2="160" stroke="#00FF88" stroke-width="1" opacity="0.5"/>

    <text x="330" y="133" font-size="9" fill="#00FF88" opacity="0.8">f(n-1)</text>
    <text x="330" y="153" font-size="9" fill="#00D4FF" opacity="0.8">f(n-2)</text>
    <text x="330" y="173" font-size="9" fill="#FF00FF" opacity="0.8">BASE</text>
  </g>

  <!-- Spiral arrows showing recursion -->
  <path d="M 320,100 Q 340,110 330,130 Q 320,150 340,160" fill="none" stroke="#FFFF00" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  <polygon points="340,160 345,150 335,155" fill="#FFFF00" opacity="0.6"/>

  <!-- Fractals/snowflake pattern -->
  <circle cx="60" cy="330" r="4" fill="#00FF88" opacity="0.5"/>
  <circle cx="340" cy="340" r="3" fill="#FF00FF" opacity="0.5"/>
  <circle cx="200" cy="360" r="5" fill="#00D4FF" opacity="0.4"/>

  <!-- Title background -->
  <rect x="0" y="420" width="400" height="80" fill="#000000" opacity="0.8"/>

  <!-- Title -->
  <text x="200" y="460" font-size="48" font-weight="bold" fill="#FF00FF" text-anchor="middle" font-family="Arial">RECURSION</text>
</svg>
